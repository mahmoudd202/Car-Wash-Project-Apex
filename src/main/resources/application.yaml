
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carwash}
    username: ${DB_USER:carwash}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  api-key: ${API_KEY:}

springdoc:
  show-actuator: true
  paths-to-exclude: /actuator

